data_dir: D:/er_data/student_resource/dataset
cache_dir: D:/er_data/pq
work_dir: D:/er_data/work_dev
artifacts_dir: D:/er_data/work_dev/artifacts
out_dir: D:/er_data/work_dev/output
seed: 0
n_jobs: 6
n_folds: 5
sample:
  train: 0.08
  test: 1.0
blocking:
  block_ratio: 8
  index_type: auto
  k_fwd: 30
  k_rev: 10
  key_cols:
    concat: key_concat
    house_loc: key_house_loc
    house_street: key_house_street
    name: key_name
    name_pair:
    - name_key
    - name_key
    name_x_num:
    - name_key
    - addr_nums
    skel: key_skel
  key_max_block:
    name_pair: 30
    name_x_num: 30
  lsa:
    dim: 128
    max_features: 300000
    ngram:
    - 2
    - 4
    views:
    - name
    - addr
    - both
  max_block: 50
  select:
    avg_per_s1: 50
    min_per_cand: 2
    min_per_s1: 5
    n_jobs: 6
    neg_frac: 0.15
    rounds: 150
neg_downsample:
  keep_top: 15
  rest_frac: 0.3
stack:
  stage2_models:
  - lgb
  extra_scores: []
gbdt_train_s1_frac: 0.4
gbdt_params:
  lgb:
    num_leaves: 127
    learning_rate: 0.08
    min_data_in_leaf: 200
    num_boost_round: 1500
    num_threads: 6
