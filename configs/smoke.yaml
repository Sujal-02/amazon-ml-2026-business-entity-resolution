data_dir: D:/er_data/student_resource/dataset
cache_dir: D:/er_data/pq
work_dir: D:/er_data/work_smoke
artifacts_dir: D:/er_data/work_smoke/artifacts
out_dir: D:/er_data/work_smoke/output
seed: 0
n_jobs: 2
n_folds: 5
sample:
  train: 0.01
  test: 0.02
blocking:
  block_ratio: 8
  index_type: auto
  k_fwd: 30
  k_rev: 10
  key_cols:
    concat: key_concat
    house_loc: key_house_loc
    house_street: key_house_street
    name: key_name
    name_pair:
    - name_key
    - name_key
    name_x_num:
    - name_key
    - addr_nums
    skel: key_skel
  key_max_block:
    name_pair: 30
    name_x_num: 30
  lsa:
    dim: 128
    max_features: 50000
    ngram:
    - 2
    - 4
    views:
    - name
    - addr
    - both
  max_block: 50
  select:
    avg_per_s1: 50
    min_per_cand: 2
    min_per_s1: 5
    n_jobs: 2
    neg_frac: 0.15
    rounds: 150
neg_downsample:
  keep_top: 15
  rest_frac: 0.3
stack:
  stage2_models:
  - lgb
  - xgb
  - cat
  extra_scores: []
gbdt_train_s1_frac: 1.0
gbdt_params:
  lgb:
    num_boost_round: 60
    num_threads: 2
  xgb:
    num_boost_round: 40
    nthread: 2
  cat:
    iterations: 40
    thread_count: 2
features_chunk_pairs: 150000
decision_unseen_bias: -0.7
finalize:
  test_dir: D:/er_data/student_resource/dataset/test
  validator: D:/er_data/student_resource/utils/validate_submission.py
  out_dir: D:/er_data/work_smoke/output/final
tune:
  s1_frac: 0.3
  threads: 7
allow_cpu: true
